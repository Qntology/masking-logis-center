[package]
name = "privacy-filter-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "OpenAI Privacy Filter — PII detection inference in pure Rust with Burn ML"
keywords = ["privacy", "PII", "NER", "token-classification", "inference"]
categories = ["science", "text-processing", "command-line-utilities"]
authors = ["Eugene Hauptmann"]
license = "Apache-2.0"
homepage = "https://github.com/eugenehp/privacy-filter-rs"
repository = "https://github.com/eugenehp/privacy-filter-rs"
documentation = "https://docs.rs/privacy-filter-rs"
readme = "README.md"

exclude = [
    "data/*",
    "bench.png",
    "bench.py",
    "bench_chart.py",
    ".DS_Store",
]

[lib]
name = "privacy_filter_rs"
path = "src/lib.rs"

[[bin]]
name = "privacy-filter"
path = "src/bin/infer.rs"

[[example]]
name = "infer"
path = "examples/infer.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"

[features]
default = ["ndarray"]
# CPU backend — Rayon multi-threading + SIMD
ndarray         = ["dep:burn-ndarray", "burn/ndarray"]
# macOS: Apple Accelerate BLAS (recommended on Apple Silicon)
blas-accelerate = ["burn-ndarray?/blas-accelerate"]
# Linux: system OpenBLAS
openblas-system = ["burn-ndarray?/blas-openblas-system"]
# GPU: wgpu on Metal (macOS) or Vulkan (Linux)
wgpu            = ["burn/wgpu"]
# GPU: wgpu with f16 — faster but produces wrong results (precision loss in MoE)
wgpu-f16        = ["burn/wgpu"]
# Apple Silicon: MLX backend (fastest correct backend on macOS)
mlx             = ["dep:burn-mlx"]

[dependencies]
burn = { version = "0.20.1", default-features = false, features = ["std", "simd"] }
burn-ndarray = { version = "0.20.1", default-features = false, features = ["std", "simd", "multi-threads"], optional = true }
burn-mlx = { version = "0.1.2", git = "https://github.com/eidolons-ai/burn-mlx", branch = "burn-0-20", optional = true }

# Weight loading (safetensors format, bf16 → f32 conversion)
safetensors = "0.7"
half = { version = "2", features = ["bytemuck"] }

# BPE tokenizer (loads tokenizer.json from HuggingFace)
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# Config parsing
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"

# Thread pool
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
cubek-matmul = { git = "https://github.com/eugenehp/cubek.git", branch = "cubek-matmul", package = "cubek-matmul" }
