<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Browser</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header id="tab-header">
      <div id="tab-bar"></div>
      <div class="tab-controls">
        <input id="url-input" placeholder="https://google.com" value="https://google.com" />
        <button id="new-tab-btn">+ New Tab</button>
      </div>
    </header>
    
    <div id="container">
      <div id="left-nav">
        <h3>Navigation</h3>
        <button id="login-btn">Google OAuth Login</button>
      </div>
      <div id="main-browser">
        <!-- Browser content will be injected or managed via iframes/windows -->
        <div id="browser-placeholder">Select a tab to view content</div>
      </div>
      <div id="right-chat">
        <div id="history-scroll">
          <pre id="cli-output"></pre>
          <div id="diff-output"></div>
        </div>
        <div id="chat-input-area">
          <input id="cli-input" placeholder="Enter CLI command..." />
          <button id="run-btn">Run</button>
        </div>
      </div>
    </div>
  </body>
</html>
