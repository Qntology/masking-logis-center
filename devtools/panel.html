<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #log { flex: 1; padding: 10px; overflow-y: auto; background: #fff; }
        #input-area { padding: 10px; border-top: 1px solid #ccc; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="log"><div>Gemini Agent Ready.</div></div>
    <div id="input-area">
        <input type="text" id="cli-input" placeholder="명령어 입력...">
    </div>
    <script>
        const input = document.getElementById('cli-input');
        const log = document.getElementById('log');

        input.onkeypress = (e) => {
            if (e.key === 'Enter' && input.value) {
                const cmd = input.value;
                input.value = '';
                log.innerHTML += `<div><strong>You:</strong> ${cmd}</div>`;
                // InspectedWindow를 통해 페이지 내 객체와 통신하거나
                // 여기서는 간단히 페이지에 메시지를 보내는 방식을 사용합니다.
                chrome.devtools.inspectedWindow.eval(`window.postMessage({type: 'gemini_cmd', cmd: '${cmd}'}, '*')`);
            }
        };

        window.addEventListener('message', (e) => {
            if (e.data.type === 'gemini_response') {
                log.innerHTML += `<div style="color:blue"><strong>AI:</strong> ${e.data.res}</div>`;
            }
        });
    </script>
</body>
</html>
