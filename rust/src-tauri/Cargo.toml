[package]
name = "rust"
version = "0.1.0"
description = "A Tauri App"
authors = ["che"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# mistralrs = { path = "mistralrs/mistralrs", default-features = false, features = ["cuda"] }
image = { version = "0.25", features = ["jpeg", "png"] }
base64 = "0.22"
anyhow = "1.0"
regex = "1"
encoding_rs = "0.8"
flate2 = "1.0"
futures = "0.3"
uuid = { version = "1.4", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }
sysinfo = "0.30"
mimalloc = { version = "*", features = ["v3"] }
drag = "2.1.1"
candle-core = "0.11.0"
ahash = "0.8.11"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
candle-flash-attn = { version = "0.11.0", optional = true }
tokenizers = "0.22.1"
num = "0.4.3"
minijinja = "2.12.0"
rayon = "1.10"
dirs = "6.0.0"
url = "2.5.7"
fantoccini = "0.19"
chromiumoxide = { version = "0.8.0", features = ["tokio-runtime"] }
which = "6.0"
once_cell = "1.18"
scraper = "0.25.0"
lancedb = { version = "0.31.0", default-features = false }
safetensors = "0.4"
ethers-core = "2.0"
ethers-signers = "2.0"
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
ego-tree = "0.10"
nvml-wrapper = "0.9.0"
half = "2.4"
memmap2 = "0.9"
webrtc = "0.10"
rcgen = "0.13"
rand = "0.8"
rand_chacha = "0.3"
windows-sys = { version = "0.52", features = ["Win32_System_Threading", "Win32_System_Memory"] }
libc = "0.2"
boa_engine = { path = "../crates/boa-engine/core/engine" }
onnxruntime = { path = "../crates/onnxruntime" }
# 🌟 [CRITICAL FIX] onnxruntime 0.0.14 내부의 하드코딩된 의존성 락(<0.15.2)을 통과하기 위해
# 허용된 가장 높은 버전인 0.15.1로 최종 고정합니다.
ndarray = "0.15.1"
whatlang = "0.18.0"

[target.'cfg(windows)'.dependencies]
direct-storage = { path = "./direct-storage" }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Direct3D12", "Win32_Security", "Win32_System_IO"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"

[features]
default = ["cuda"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
flash-attn = []


[profile.dev]
opt-level = 0      # 기본값 0(최적화 없음)을 2로 올려서 실행 속도를 개선합니다.
incremental = true # 변경된 부분만 빌드해서 시간을 아낍니다.

[profile.release]
opt-level = 3   # 실행 속도 최대
strip = true      # 모든 심볼 제거 (함수 이름 등 삭제)
lto = true        # 전체 프로그램 최적화 (코드 분석을 훨씬 어렵게 함)
panic = "abort"   # 에러 발생 시 정보를 남기지 않음
codegen-units = 16 # 빌드 속도 개선
