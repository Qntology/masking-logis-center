[package]
name = "gemini-gui"
version = "0.1.0"
edition = "2021"

[lib]
name = "gemini_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
chromiumoxide = { version = "0.8.0", features = ["default"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
lancedb = "0.29.0"
scraper = "0.20.0"
sha2 = "0.11.0"
arrow = "58.3.0"
lance-tokenizer = "6.0.0"
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
tokenizers = "0.21.0"
anyhow = "1.0.95"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
bytes = "1.11.1"
base64 = "0.22.1"
image = "0.25.5"
lazy_static = "1.5.0"

[features]
default = ["cuda"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cpu = []
flash-attn = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_System_Threading", "Win32_System_Memory", "Win32_Foundation"] }
